<svg width="100%" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Nebula AI Platform — Install Flow &amp; Architecture</title>
<desc>How the one-line installer works on a Linux server and the resulting architecture.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0618"/><stop offset="0.5" stop-color="#150e34"/><stop offset="1" stop-color="#08122a"/>
</linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#211c52"/><stop offset="1" stop-color="#131031"/>
</linearGradient>
<linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0b0f1a"/>
</linearGradient>
<radialGradient id="amb" cx="0.5" cy="0.3" r="0.7">
<stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
</radialGradient>
<filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
<marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 Z" fill="#818cf8"/>
</marker>
</defs>

<rect width="1000" height="640" rx="20" fill="url(#bg)"/>
<ellipse cx="500" cy="120" rx="520" ry="220" fill="url(#amb)"/>
<g fill="#fff"><circle cx="60" cy="40" r="1.2" opacity="0.6"/><circle cx="940" cy="50" r="1.3" opacity="0.6"/><circle cx="500" cy="26" r="1" opacity="0.5"/><circle cx="40" cy="600" r="1.1" opacity="0.5"/><circle cx="960" cy="610" r="1.2" opacity="0.5"/></g>

<!-- title -->
<text x="500" y="52" text-anchor="middle" font-family="Verdana" font-size="24" font-weight="bold" fill="url(#g)" letter-spacing="1">INSTALL FLOW &amp; ARCHITECTURE</text>
<text x="500" y="74" text-anchor="middle" font-family="Verdana" font-size="11" fill="#94a3b8" letter-spacing="2">From one command to a running platform</text>

<!-- ===== STEP 1: user runs one line ===== -->
<text x="60" y="112" font-family="Verdana" font-size="12" font-weight="bold" fill="#c7d2fe">① You run one line on a fresh Ubuntu server</text>
<g filter="url(#sh)">
<rect x="60" y="122" width="880" height="72" rx="10" fill="url(#term)" stroke="#334155" stroke-width="1"/>
<rect x="60" y="122" width="880" height="22" rx="10" fill="#1f2937"/>
<rect x="60" y="138" width="880" height="6" fill="#1f2937"/>
<circle cx="78" cy="133" r="4" fill="#f87171"/><circle cx="94" cy="133" r="4" fill="#fbbf24"/><circle cx="110" cy="133" r="4" fill="#34d399"/>
<text x="500" y="137" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">root@ubuntu: ~</text>
<text x="78" y="170" font-family="monospace" font-size="13" fill="#6ee7b7">$ </text>
<text x="96" y="170" font-family="monospace" font-size="13" fill="#e5e7eb">bash &lt;(curl -Ls https://nebulapanel.cloud/install)</text>
<text x="78" y="186" font-family="monospace" font-size="10" fill="#64748b"># graphical installer opens · pick language · choose Install</text>
</g>

<!-- arrow down -->
<line x1="500" y1="196" x2="500" y2="216" stroke="#818cf8" stroke-width="2" marker-end="url(#arw)"/>

<!-- ===== STEP 2: installer does 5 things ===== -->
<text x="60" y="234" font-family="Verdana" font-size="12" font-weight="bold" fill="#c7d2fe">② The installer provisions everything automatically</text>
<g font-family="Verdana">
<g filter="url(#sh)"><rect x="60" y="244" width="168" height="80" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="144" y="272" text-anchor="middle" font-size="24">🐳</text><text x="144" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0e7ff">Install Docker</text><text x="144" y="310" text-anchor="middle" font-size="8" fill="#94a3b8">+ dependencies</text>

<g filter="url(#sh)"><rect x="238" y="244" width="168" height="80" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="322" y="272" text-anchor="middle" font-size="24">🔐</text><text x="322" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0e7ff">Generate .env</text><text x="322" y="310" text-anchor="middle" font-size="8" fill="#94a3b8">random secrets &amp; pass</text>

<g filter="url(#sh)"><rect x="416" y="244" width="168" height="80" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="500" y="272" text-anchor="middle" font-size="24">📦</text><text x="500" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0e7ff">Pull Image</text><text x="500" y="310" text-anchor="middle" font-size="8" fill="#94a3b8">from Docker Hub</text>

<g filter="url(#sh)"><rect x="594" y="244" width="168" height="80" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="678" y="272" text-anchor="middle" font-size="24">🚀</text><text x="678" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0e7ff">Start Service</text><text x="678" y="310" text-anchor="middle" font-size="8" fill="#94a3b8">always-on container</text>

<g filter="url(#sh)"><rect x="772" y="244" width="168" height="80" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="856" y="272" text-anchor="middle" font-size="24">🔒</text><text x="856" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0e7ff">Optional SSL</text><text x="856" y="310" text-anchor="middle" font-size="8" fill="#94a3b8">domain or IP</text>
</g>

<!-- arrow down -->
<line x1="500" y1="326" x2="500" y2="346" stroke="#818cf8" stroke-width="2" marker-end="url(#arw)"/>

<!-- ===== STEP 3: architecture — the running server ===== -->
<text x="60" y="364" font-family="Verdana" font-size="12" font-weight="bold" fill="#c7d2fe">③ Resulting architecture on your server</text>

<!-- big server box -->
<g filter="url(#sh)">
<rect x="60" y="376" width="880" height="180" rx="14" fill="#0f0c28" stroke="#3730a3" stroke-width="1.5"/>
</g>
<text x="80" y="400" font-family="Verdana" font-size="11" font-weight="bold" fill="#a5b4fc">🖥️  Ubuntu Server</text>

<!-- Nginx (SSL) -->
<g filter="url(#sh)"><rect x="86" y="412" width="150" height="126" rx="10" fill="url(#card)" stroke="#6d28d9" stroke-width="1"/></g>
<text x="161" y="440" text-anchor="middle" font-family="Verdana" font-size="22">🔒</text>
<text x="161" y="462" text-anchor="middle" font-family="Verdana" font-size="11" font-weight="bold" fill="#e0e7ff">Nginx + SSL</text>
<text x="161" y="478" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">reverse proxy</text>
<text x="161" y="492" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">443 → 3000</text>
<text x="161" y="516" text-anchor="middle" font-family="Verdana" font-size="8" fill="#6ee7b7">https://your-domain</text>

<!-- arrow -->
<line x1="240" y1="475" x2="272" y2="475" stroke="#818cf8" stroke-width="2" marker-end="url(#arw)"/>

<!-- Docker container -->
<g filter="url(#sh)"><rect x="278" y="412" width="360" height="126" rx="10" fill="#0d1b33" stroke="#0e7490" stroke-width="1.5"/></g>
<text x="298" y="432" font-family="Verdana" font-size="10" font-weight="bold" fill="#7dd3fc">🐳 Docker Container (sealed image)</text>
<g filter="url(#sh)"><rect x="298" y="442" width="150" height="40" rx="8" fill="url(#card)"/></g>
<text x="373" y="460" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#e0e7ff">🌐 Admin Panel</text>
<text x="373" y="474" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">Express · port 3000</text>
<g filter="url(#sh)"><rect x="298" y="488" width="150" height="40" rx="8" fill="url(#card)"/></g>
<text x="373" y="506" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#e0e7ff">🤖 Telegram Bot</text>
<text x="373" y="520" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">grammY runtime</text>
<g filter="url(#sh)"><rect x="462" y="442" width="160" height="86" rx="8" fill="url(#card)"/></g>
<text x="542" y="462" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#e0e7ff">🗄️ SQLite DB</text>
<text x="542" y="478" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">users · tasks · licenses</text>
<text x="542" y="491" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">settings · payments</text>
<text x="542" y="512" text-anchor="middle" font-family="Verdana" font-size="8" fill="#c4b5fd">↕ persistent volume</text>

<!-- volume -->
<g filter="url(#sh)"><rect x="662" y="412" width="120" height="126" rx="10" fill="url(#card)" stroke="#a16207" stroke-width="1"/></g>
<text x="722" y="452" text-anchor="middle" font-family="Verdana" font-size="22">💾</text>
<text x="722" y="474" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#fcd34d">Volume</text>
<text x="722" y="490" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">nebula-data</text>
<text x="722" y="514" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">survives updates</text>

<!-- CLI -->
<g filter="url(#sh)"><rect x="806" y="412" width="118" height="126" rx="10" fill="url(#card)" stroke="#3730a3" stroke-width="1"/></g>
<text x="865" y="452" text-anchor="middle" font-family="Verdana" font-size="22">⌨️</text>
<text x="865" y="474" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#e0e7ff">nebula CLI</text>
<text x="865" y="490" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">update · logs</text>
<text x="865" y="502" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">ssl · restart</text>

<!-- external connections -->
<line x1="542" y1="538" x2="542" y2="576" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>
<line x1="373" y1="538" x2="373" y2="576" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>

<!-- ===== STEP 4: outside world ===== -->
<g filter="url(#sh)"><rect x="300" y="580" width="150" height="44" rx="10" fill="#0d1b33" stroke="#229ED9" stroke-width="1"/></g>
<text x="375" y="600" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#7dd3fc">📱 Telegram API</text>
<text x="375" y="614" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">your bot &amp; users</text>

<g filter="url(#sh)"><rect x="470" y="580" width="160" height="44" rx="10" fill="#0d1b33" stroke="#6d28d9" stroke-width="1"/></g>
<text x="550" y="600" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="bold" fill="#c4b5fd">🔑 License Server</text>
<text x="550" y="614" text-anchor="middle" font-family="Verdana" font-size="8" fill="#94a3b8">verify Pro license</text>
</svg>
