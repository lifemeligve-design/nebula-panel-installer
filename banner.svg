<radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
<stop offset="0.4" stop-color="#8b5cf6" stop-opacity="0.4"/>
<stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
