<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0618"/>
<stop offset="0.45" stop-color="#1e123f"/>
<stop offset="0.75" stop-color="#181447"/>
<stop offset="1" stop-color="#0a1730"/>
</linearGradient>
<linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
