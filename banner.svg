<circle cx="60" cy="250" r="1.3" opacity="0.7"/><circle cx="160" cy="270" r="1" opacity="0.5"/>
<circle cx="840" cy="245" r="1.4" opacity="0.7"/><circle cx="770" cy="275" r="1" opacity="0.5"/>
