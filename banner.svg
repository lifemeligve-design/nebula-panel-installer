<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nebula AI Platform</title>
<desc>Banner for the Nebula AI Platform — an all-in-one Telegram bot and management platform.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1a1030"/>
<stop offset="0.5" stop-color="#241448"/>
<stop offset="1" stop-color="#0e1a3a"/>
</linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8b5cf6"/>
<stop offset="0.5" stop-color="#6366f1"/>
<stop offset="1" stop-color="#38bdf8"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
<stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="680" height="240" rx="16" fill="url(#bg)"/>
<ellipse cx="340" cy="120" rx="260" ry="120" fill="url(#glow)"/>

<circle cx="70" cy="45" r="1.5" fill="#ffffff" opacity="0.7"/>
<circle cx="140" cy="30" r="1" fill="#a5b4fc" opacity="0.6"/>
<circle cx="600" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
<circle cx="560" cy="200" r="1" fill="#7dd3fc" opacity="0.6"/>
<circle cx="90" cy="205" r="1.2" fill="#c4b5fd" opacity="0.6"/>
<circle cx="640" cy="140" r="1" fill="#ffffff" opacity="0.5"/>
<circle cx="40" cy="130" r="1" fill="#a5b4fc" opacity="0.5"/>
<circle cx="620" cy="95" r="1.3" fill="#ffffff" opacity="0.6"/>
<circle cx="180" cy="210" r="1" fill="#7dd3fc" opacity="0.5"/>

<circle cx="340" cy="88" r="30" fill="none" stroke="url(#txt)" stroke-width="2"/>
<ellipse cx="340" cy="88" rx="30" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
<circle cx="340" cy="88" r="5" fill="#8b5cf6"/>
<circle cx="370" cy="88" r="2.5" fill="#38bdf8"/>

<text x="340" y="158" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="42" font-weight="bold" fill="url(#txt)" letter-spacing="2">NEBULA</text>
<text x="340" y="184" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="15" font-weight="normal" fill="#94a3b8" letter-spacing="6">AI  PLATFORM</text>
<text x="340" y="212" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#64748b" letter-spacing="1">All-in-one Telegram Bot &amp; Panel  ·  installed in one line</text>
